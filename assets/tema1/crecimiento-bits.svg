<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Crecimiento de combinaciones binarias</title><desc id="desc">Con uno, dos y tres bits se obtienen dos, cuatro y ocho combinaciones.</desc><rect width="1200" height="560" rx="36" fill="#FFFAF4"/><text x="70" y="80" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#3C271F">Cada bit duplica el número de patrones posibles</text><g transform="translate(70 130)"><rect width="300" height="350" rx="28" fill="#DCEAF0" stroke="#EAD8CC" stroke-width="3"/><text x="150" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="800" fill="#496B83">1 bit</text><text x="150" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#3C271F">2 patrones</text><rect x="55" y="140" width="90" height="31" rx="8" fill="white"/><text x="100" y="162" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#3C271F">0</text><rect x="175" y="140" width="90" height="31" rx="8" fill="white"/><text x="220" y="162" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#3C271F">1</text></g><g transform="translate(425 130)"><rect width="300" height="350" rx="28" fill="#DDEBE0" stroke="#EAD8CC" stroke-width="3"/><text x="150" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="800" fill="#4F715D">2 bits</text><text x="150" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#3C271F">4 patrones</text><text x="150" y="160" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#3C271F">00   01</text><text x="150" y="205" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#3C271F">10   11</text></g><g transform="translate(780 130)"><rect width="300" height="350" rx="28" fill="#FFF3E6" stroke="#EAD8CC" stroke-width="3"/><text x="150" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="800" fill="#B55230">3 bits</text><text x="150" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#3C271F">8 patrones</text><text x="150" y="155" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#3C271F">000  001</text><text x="150" y="190" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#3C271F">010  011</text><text x="150" y="225" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#3C271F">100  101</text><text x="150" y="260" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#3C271F">110  111</text></g><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#3C271F">n bits  →  2ⁿ patrones diferentes</text></svg>