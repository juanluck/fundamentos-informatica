<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Del mundo a los bits</title><desc id="desc">Texto, imagen y sonido se codifican como patrones de bits que procesa un computador.</desc><rect width="1200" height="620" rx="36" fill="#FFFAF4"/><text x="70" y="85" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#3C271F">Muchas formas de información, un mismo soporte</text><g transform="translate(70 145)"><rect width="260" height="125" rx="22" fill="#FFFFFF" stroke="#EAD8CC" stroke-width="3"/><text x="28" y="48" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#B55230">TEXTO</text><text x="28" y="90" font-family="Georgia,serif" font-size="33" fill="#3C271F">Hola</text></g><g transform="translate(70 295)"><rect width="260" height="125" rx="22" fill="#FFFFFF" stroke="#EAD8CC" stroke-width="3"/><text x="28" y="48" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#4F715D">IMAGEN</text><circle cx="75" cy="84" r="20" fill="#976B28"/><path d="M35 105 L95 56 L130 91 L170 60 L220 105 Z" fill="#DDEBE0" stroke="#4F715D" stroke-width="3"/></g><g transform="translate(70 445)"><rect width="260" height="105" rx="22" fill="#FFFFFF" stroke="#EAD8CC" stroke-width="3"/><text x="28" y="43" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#496B83">SONIDO</text><path d="M28 75 Q50 30 72 75 T116 75 T160 75 T204 75" fill="none" stroke="#496B83" stroke-width="5"/></g><path d="M365 325 H510" stroke="#D98A62" stroke-width="7" stroke-linecap="round"/><path d="M495 307 L520 325 L495 343" fill="none" stroke="#D98A62" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(535 205)"><rect width="250" height="245" rx="28" fill="#B55230" opacity=".96"/><text x="125" y="73" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="white">CODIFICACIÓN</text><text x="125" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="white">reglas que asignan</text><text x="125" y="153" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="white">significado a patrones</text><rect x="42" y="183" width="42" height="42" rx="8" fill="#FFF3E6"/><text x="63" y="212" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#3C271F">0</text><rect x="96" y="183" width="42" height="42" rx="8" fill="#FFF3E6"/><text x="117" y="212" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#3C271F">1</text><rect x="150" y="183" width="42" height="42" rx="8" fill="#FFF3E6"/><text x="171" y="212" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#3C271F">1</text></g><path d="M815 325 H920" stroke="#D98A62" stroke-width="7" stroke-linecap="round"/><path d="M905 307 L930 325 L905 343" fill="none" stroke="#D98A62" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(950 170)"><rect width="180" height="310" rx="28" fill="#FFFFFF" stroke="#EAD8CC" stroke-width="3"/><text x="90" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#3C271F">COMPUTADOR</text><rect x="35" y="90" width="110" height="70" rx="12" fill="#DCEAF0" stroke="#496B83" stroke-width="3"/><text x="90" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#496B83">procesa</text><rect x="35" y="190" width="110" height="70" rx="12" fill="#DDEBE0" stroke="#4F715D" stroke-width="3"/><text x="90" y="233" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#4F715D">almacena</text></g></svg>