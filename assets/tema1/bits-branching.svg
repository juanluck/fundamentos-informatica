<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="t d"><title id="t">Crecimiento de patrones binarios</title><desc id="d">Cada bit adicional divide cada posibilidad en dos y duplica el número de patrones.</desc><rect width="980" height="420" fill="#FFF9F0"/><g font-family="Georgia,serif" fill="#243744"><text x="85" y="48" font-size="26" font-weight="700">1 bit</text><text x="383" y="48" font-size="26" font-weight="700">2 bits</text><text x="742" y="48" font-size="26" font-weight="700">3 bits</text></g><g stroke="#C7A993" stroke-width="3" fill="none"><path d="M140 125C235 125 240 95 315 95M140 125C235 125 240 155 315 155"/><path d="M440 95C540 95 545 70 640 70M440 95C540 95 545 120 640 120M440 155C540 155 545 190 640 190M440 155C540 155 545 240 640 240"/></g><g font-family="ui-monospace,monospace" font-size="24" font-weight="700" text-anchor="middle"><g fill="#A94F2F"><rect x="95" y="92" width="90" height="66" rx="12" fill="#F7E0CF"/><text x="140" y="133">0/1</text></g><g fill="#315B65"><rect x="315" y="62" width="125" height="60" rx="10" fill="#DDEBE7"/><rect x="315" y="128" width="125" height="60" rx="10" fill="#DDEBE7"/><text x="377" y="100">00 · 01</text><text x="377" y="166">10 · 11</text></g><g fill="#7B4C2E"><rect x="640" y="42" width="230" height="58" rx="10" fill="#FAEEDB"/><rect x="640" y="105" width="230" height="58" rx="10" fill="#FAEEDB"/><rect x="640" y="168" width="230" height="58" rx="10" fill="#FAEEDB"/><rect x="640" y="231" width="230" height="58" rx="10" fill="#FAEEDB"/><text x="755" y="79">000 · 001</text><text x="755" y="142">010 · 011</text><text x="755" y="205">100 · 101</text><text x="755" y="268">110 · 111</text></g></g><path d="M80 342H900" stroke="#D8C7B8" stroke-width="2"/><text x="490" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#243744">cada bit nuevo duplica el número de posibilidades</text></svg>