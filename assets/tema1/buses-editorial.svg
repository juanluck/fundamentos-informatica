<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430" role="img" aria-labelledby="t d"><title id="t">Buses entre CPU y memoria</title><desc id="d">La CPU y la memoria se conectan mediante bus de direcciones, bus de datos y señales de control.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#C95D33"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#2F7372"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#8B8B86"/></marker></defs><rect width="1050" height="430" fill="#FFF9F0"/><g font-family="Georgia,serif" font-weight="700" font-size="30" text-anchor="middle"><rect x="60" y="105" width="170" height="220" rx="16" fill="#C96844"/><text x="145" y="225" fill="white">CPU</text><rect x="820" y="105" width="170" height="220" rx="16" fill="#496A78"/><text x="905" y="225" fill="white">Memoria</text></g><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><line x1="255" y1="140" x2="795" y2="140" stroke="#C95D33" stroke-width="5" marker-end="url(#a)"/><text x="525" y="118" text-anchor="middle" fill="#B14D2A">Bus de direcciones · ¿dónde?</text><line x1="255" y1="220" x2="795" y2="220" stroke="#2F7372" stroke-width="5" marker-end="url(#b)"/><line x1="795" y1="240" x2="255" y2="240" stroke="#2F7372" stroke-width="5" marker-end="url(#b)"/><text x="525" y="204" text-anchor="middle" fill="#2F7372">Bus de datos · ¿qué información?</text><line x1="255" y1="315" x2="795" y2="315" stroke="#8B8B86" stroke-width="4" marker-end="url(#g)"/><text x="525" y="350" text-anchor="middle" fill="#6F6F69">Señales de control · ¿qué operación?</text></g></svg>