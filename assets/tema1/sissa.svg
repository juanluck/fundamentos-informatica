<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">La leyenda de Sissa y el crecimiento exponencial</title><desc id="desc">Un tablero de ajedrez muestra que duplicar en cada casilla produce un crecimiento muy rápido.</desc><rect width="1200" height="650" rx="36" fill="#FFFAF4"/><text x="70" y="78" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#3C271F">Duplicar parece inocente… hasta que lo repites</text><text x="70" y="118" font-family="Georgia,serif" font-size="22" fill="#3C271F">La historia de Sissa convierte las potencias de 2 en una imagen fácil de recordar.</text><g transform="translate(75 165)"><rect width="416" height="416" rx="8" fill="#FFF3E6" stroke="#B55230" stroke-width="4"/><g fill="#D98A62"><rect x="52" width="52" height="52"/><rect x="156" width="52" height="52"/><rect x="260" width="52" height="52"/><rect x="364" width="52" height="52"/><rect y="52" width="52" height="52"/><rect x="104" y="52" width="52" height="52"/><rect x="208" y="52" width="52" height="52"/><rect x="312" y="52" width="52" height="52"/><rect x="52" y="104" width="52" height="52"/><rect x="156" y="104" width="52" height="52"/><rect x="260" y="104" width="52" height="52"/><rect x="364" y="104" width="52" height="52"/></g><text x="26" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800">1</text><text x="78" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800" fill="white">2</text><text x="130" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800">4</text><text x="182" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800" fill="white">8</text><text x="234" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800">16</text><text x="286" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800" fill="white">32</text><text x="338" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800">64</text><text x="390" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800" fill="white">128</text></g><g transform="translate(570 190)"><text x="0" y="0" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#B55230">CASILLA k</text><text x="0" y="60" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#3C271F">2ᵏ⁻¹</text><text x="0" y="118" font-family="Georgia,serif" font-size="24" fill="#3C271F">granos en esa casilla</text><path d="M0 165 H500" stroke="#EAD8CC" stroke-width="3"/><text x="0" y="220" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#496B83">TOTAL EN 64 CASILLAS</text><text x="0" y="282" font-family="Georgia,serif" font-size="44" font-weight="700" fill="#3C271F">2⁶⁴ − 1</text><text x="0" y="334" font-family="Georgia,serif" font-size="22" fill="#3C271F">El crecimiento exponencial desborda</text><text x="0" y="366" font-family="Georgia,serif" font-size="22" fill="#3C271F">rápidamente nuestra intuición lineal.</text></g></svg>