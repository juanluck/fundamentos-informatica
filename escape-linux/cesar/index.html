<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FIE · Decodificador César</title>
  <link rel="stylesheet" href="../escape.css">
</head>
<body>
  <main class="decoder">
    <section class="panel">
      <div class="eyebrow">FIE-LAB · HERRAMIENTA DE RECUPERACIÓN</div>
      <h1>Decodificador César</h1>
      <p>Introduce exactamente la referencia y el desplazamiento indicados en el informe de mantenimiento.</p>

      <div class="field">
        <label for="code">Referencia codificada</label>
        <input id="code" autocomplete="off" placeholder="Ej.: ABCDE-XYZ-0000">
      </div>
      <div class="field">
        <label for="shift">Desplazamiento</label>
        <input id="shift" type="number" inputmode="numeric" value="3">
      </div>
      <button class="button" id="decode">Descodificar</button>
      <div class="error" id="error"></div>
      <div class="result" id="result">
        <span>Referencia descodificada</span>
        <strong id="plain"></strong>
        <p>Ésta es la contraseña de recuperación. Consérvala exactamente y regresa a la consola.</p>
      </div>
    </section>
  </main>
<script>
function caesarDecode(text, shift){
  shift=((Number(shift)%26)+26)%26;
  return [...text].map(ch=>{
    const c=ch.charCodeAt(0);
    if(c>=65&&c<=90) return String.fromCharCode((c-65-shift+26)%26+65);
    if(c>=97&&c<=122) return String.fromCharCode((c-97-shift+26)%26+97);
    return ch;
  }).join('');
}
document.getElementById('decode').addEventListener('click',()=>{
  const raw=document.getElementById('code').value.trim();
  const shift=document.getElementById('shift').value;
  const err=document.getElementById('error');
  const res=document.getElementById('result');
  err.textContent=''; res.style.display='none';
  if(!raw){err.textContent='Introduce la referencia del informe.';return;}
  const decoded=caesarDecode(raw,shift);
  document.getElementById('plain').textContent=decoded;
  res.style.display='block';
});
</script>
</body>
</html>
