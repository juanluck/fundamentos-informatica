name: Validate Quarto Book

on:
  pull_request:
    branches: [main]
    paths:
      - '**.qmd'
      - '**.yml'
      - 'assets/**'
      - 'components/**'
      - 'styles/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Render HTML book
        run: quarto render --to html
      - name: Preserve rendered book for review
        uses: actions/upload-artifact@v4
        with:
          name: quarto-book-preview
          path: _site/
          retention-days: 7
