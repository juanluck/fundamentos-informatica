name: Publish Quarto Book Preview

on:
  workflow_dispatch:
  push:
    branches:
      - quarto-integration-v1

concurrency:
  group: publish-quarto-book
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML book
        run: quarto render --to html

      - name: Publish only /book on gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/gh-pages gh-pages
          rm -rf /tmp/gh-pages/book
          mkdir -p /tmp/gh-pages/book
          cp -a _site/. /tmp/gh-pages/book/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git add book .nojekyll
          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "Publish Quarto book preview"
            git push origin gh-pages
          fi
