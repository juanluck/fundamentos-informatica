project:
  type: book

book:
  title: "Fundamentos de Informática"
  author: "Juan Luis Jiménez"
  chapters:
    - index.qmd
    - part: "Parte I — Teoría"
      chapters:
        - teoria/tema1/index.qmd
        - teoria/tema1/01-que-es-computador.qmd
        - teoria/tema1/02-representacion.qmd
        - teoria/tema1/04-comunicacion.qmd
  page-navigation: true

format:
  html:
    theme:
      light:
        - cosmo
        - styles/book.scss
    toc: false
    number-sections: false
    smooth-scroll: true
    code-copy: true
    include-after-body:
      - assets/components.js
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: false
    geometry:
      - top=25mm
      - bottom=25mm
      - left=28mm
      - right=24mm
    include-in-header:
      - includes/pdf-preamble.tex

filters:
  - filters/components.lua

execute:
  freeze: auto

lang: es
